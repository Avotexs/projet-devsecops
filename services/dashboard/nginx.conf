server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Serve static files
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy endpoints
    location /api/vuln/ {
        proxy_pass http://vuln-detector:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/fix/ {
        proxy_pass http://fix-suggester:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/anomaly/ {
        proxy_pass http://anomaly-detector:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/report/ {
        proxy_pass http://report-generator:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
